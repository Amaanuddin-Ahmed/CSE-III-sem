<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="dropGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" filter="url(#dropGlow)" />
  <circle cx="256" cy="256" r="200" fill="#3b82f6" opacity="0.35" />

  <!-- Graduation Cap -->
  <!-- Diamond Top -->
  <polygon points="256,120 400,200 256,280 112,200" fill="#ffffff" />

  <!-- Skull Cap Underneath -->
  <path d="M176,240 C176,330 336,330 336,240 Z" fill="#f1f5f9" />

  <!-- Gold Tassel -->
  <path d="M256,200 L416,245 L416,330" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="416" cy="336" r="14" fill="#f59e0b" />

  <!-- Brand Label 'MGIT' -->
  <rect x="146" y="380" width="220" height="54" rx="16" fill="#ffffff" opacity="0.95" />
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="3">MGIT</text>
</svg>
